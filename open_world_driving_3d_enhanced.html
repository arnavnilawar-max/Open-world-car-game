<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101923">
<title>Open World Driving 3D — Enhanced</title>
<style>
:root{--glass:rgba(9,17,27,.78);--line:rgba(255,255,255,.22);--white:#fff;--accent:#ffcc33}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9df;font-family:system-ui,Arial,sans-serif;touch-action:none;color:var(--white)}
canvas{display:block}
button{font:inherit;color:white;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);border-radius:14px;min-height:42px;padding:9px 13px;font-weight:700}
button:active,.active{background:rgba(255,190,35,.9);color:#141414;border-color:#ffe08a}
#topbar{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#brand,#stats{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:8px 11px;backdrop-filter:blur(8px);text-shadow:0 1px 3px #000}
#brand{font-size:12px;font-weight:900;letter-spacing:.08em}
#stats{text-align:right;font-size:12px;line-height:1.5;min-width:110px}
#speed{font-size:22px;font-weight:900;color:var(--accent)}
#toolbar{position:fixed;top:65px;right:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#toolbar button{font-size:12px;min-height:36px;padding:7px 10px}
#controls{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 13px;pointer-events:none}
.pad{display:flex;gap:9px;align-items:flex-end;pointer-events:auto}
.control{width:64px;height:64px;min-height:64px;border-radius:50%;padding:0;font-size:24px;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.control.small{width:56px;height:56px;min-height:56px;font-size:18px}
#gas{width:72px;height:72px;min-height:72px;background:rgba(25,130,65,.85)}
#nitro{background:rgba(25,100,190,.85)}
#hint{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--glass);border:1px solid var(--line);padding:6px 10px;border-radius:10px;font-size:11px;opacity:.9}
#menu{position:fixed;inset:0;background:linear-gradient(135deg,rgba(4,12,22,.94),rgba(11,29,45,.88));display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
#panel{width:min(440px,100%);max-height:92%;overflow:auto;background:rgba(14,26,39,.96);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 70px #0008}
#panel h1{font-size:25px;margin:0 0 5px}
#panel p{font-size:13px;color:#c7d4e2;margin:0 0 16px}
#carName{font-size:19px;font-weight:900;margin:12px 0 4px}
#carDesc{font-size:12px;color:#bdcbd8;margin-bottom:14px}
.menuRow{display:flex;gap:9px;margin-top:10px}
.menuRow button{flex:1}
#start{width:100%;margin-top:15px;background:#f4b92e;color:#171717;border:0;font-size:16px;min-height:48px}
#weatherLabel{font-size:11px;color:#b8c7d8;margin-top:10px}
@media(max-width:370px){.control{width:56px;height:56px;min-height:56px}.control.small{width:49px;height:49px;min-height:49px}#gas{width:64px;height:64px;min-height:64px}#toolbar{top:60px}#toolbar button{font-size:11px}}
</style>
</head>
<body>
<div id="topbar">
  <div id="brand">OPEN WORLD<br>DRIVING 3D</div>
  <div id="stats"><div><span id="speed">0</span> km/h</div><div id="boostText">NITRO READY</div></div>
</div>
<div id="toolbar">
  <button id="cameraBtn">📷 CAMERA: CHASE</button>
  <button id="timeBtn">🌙 NIGHT MODE</button>
  <button id="weatherBtn">🌧️ RAIN: OFF</button>
  <button id="menuBtn">🚗 GARAGE</button>
</div>
<div id="hint">Hold ▲ to drive · ◀ ▶ to steer · NITRO for a boost</div>
<div id="controls">
  <div class="pad">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <div class="pad">
    <button class="control small" id="brake">▼</button>
    <button class="control" id="nitro">⚡</button>
    <button class="control" id="gas">▲</button>
  </div>
</div>
<div id="menu">
  <div id="panel">
    <h1>OPEN WORLD DRIVE</h1>
    <p>Explore a large 3D town, cruise the highways and try different cars.</p>
    <div style="height:120px;border-radius:16px;background:linear-gradient(135deg,#243d50,#101a27);display:grid;place-items:center;font-size:64px" id="carPreview">🏎️</div>
    <div id="carName">Red Sport</div>
    <div id="carDesc">Balanced sports car · Top speed 180 km/h</div>
    <div class="menuRow"><button id="prevCar">◀ Previous</button><button id="nextCar">Next ▶</button></div>
    <div class="menuRow"><button id="menuDay">☀️ Day</button><button id="menuWeather">🌤️ Clear</button></div>
    <button id="start">START DRIVING</button>
    <div id="weatherLabel">Mobile controls: steering, accelerator, brake and nitro.</div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc8ed);
scene.fog=new THREE.Fog(0x8bc8ed,110,430);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xd9efff,0x425c35,1.65);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d0,2.2);
sun.position.set(-80,120,55);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;
scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const groundMat=mat(0x477f3c),roadMat=mat(0x30343a),lineMat=mat(0xf2e9c8);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),groundMat);
ground.rotation.x=-Math.PI/2;ground.position.y=-.18;ground.receiveShadow=true;scene.add(ground);

function box(w,h,d,material,x,y,z,parent=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}
function makeRoad(x,z,w,d){
 const r=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);r.rotation.x=-Math.PI/2;r.position.set(x,.005,z);r.receiveShadow=true;scene.add(r);
 // edge lines along the longer axis
 if(w<d){
  for(const xx of [x-w/2+.45,x+w/2-.45])box(.13,.035,d,lineMat,xx,.035,z);
  for(let zz=z-d/2+8;zz<z+d/2;zz+=15)box(.22,.035,5,lineMat,x,.035,zz);
 }else{
  for(const zz of [z-d/2+.45,z+d/2-.45])box(w,.035,.13,lineMat,x,.035,zz);
  for(let xx=x-w/2+8;xx<x+w/2;xx+=15)box(5,.035,.22,lineMat,xx,.035,z);
 }
}
// City grid roads: long avenues and cross streets
for(let x=-240;x<=240;x+=80)makeRoad(x,0,18,560);
for(let z=-240;z<=240;z+=80)makeRoad(0,z,560,18);
// Smaller connecting roads
for(let x=-200;x<=200;x+=80)for(let z=-200;z<=200;z+=80){
 if(Math.abs(x)%160===0)makeRoad(x+40,z,10,62);
}
// Parks, buildings and trees fill city blocks
const buildingMats=[mat(0xb9c5ce),mat(0xd2b99a),mat(0x8fa8b8),mat(0xc4a0a0),mat(0x9cae91),mat(0xd8d0bf)];
for(let gx=-3;gx<=2;gx++)for(let gz=-3;gz<=2;gz++){
 const bx=gx*80,bz=gz*80;
 for(let j=0;j<5;j++){
  const x=bx-27+(j%3)*19+(Math.random()*5),z=bz-25+Math.floor(j/3)*28+(Math.random()*5);
  const w=10+Math.random()*7,d=10+Math.random()*7,h=9+Math.random()*32;
  const b=box(w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],x,h/2,z);
  // simple dark window bands
  for(let yy=4;yy<h-2;yy+=5){
   const winmat=mat(0x34566c,.35,.1);
   box(w*.72,.75,.035,winmat,x,yy,z-d/2-.02);
  }
 }
 // trees in leftover corners
 for(let t=0;t<4;t++){
  const x=bx-30+Math.random()*60,z=bz-30+Math.random()*60;
  if(Math.abs(x%80)<12||Math.abs(z%80)<12)continue;
  box(.65,3,.65,mat(0x76502e),x,1.5,z);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,8,7),mat(0x236b35));crown.position.set(x,4,z);crown.castShadow=true;scene.add(crown);
 }
}
// Highway loops and roadside landscape
makeRoad(0,-390,24,300);makeRoad(0,390,24,300);
for(let i=0;i<180;i++){
 const side=Math.random()<.5?-1:1,x=side*(22+Math.random()*240),z=-650+Math.random()*1300;
 const trunk=box(.45,2.4,.45,mat(0x76502e),x,1.2,z);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,7),mat(0x1e6630));crown.position.set(x,4.5,z);scene.add(crown);
}

// Detailed selectable player cars
const carTypes=[
 {name:'Red Sport',color:0xd71920,top:36,desc:'Balanced sports car · Top speed 180 km/h',emoji:'🏎️'},
 {name:'Electric Blue',color:0x1677df,top:40,desc:'Quick acceleration · Top speed 200 km/h',emoji:'🚙'},
 {name:'Golden GT',color:0xe5a51d,top:43,desc:'Powerful grand tourer · Top speed 215 km/h',emoji:'🏁'},
 {name:'Emerald Roadster',color:0x15966a,top:34,desc:'Smooth handling · Top speed 170 km/h',emoji:'🚗'}
];
let selectedCar=0,player,carBodyMat,wheelMeshes=[],cameraMode=0;
function createCar(type,traffic=false){
 const root=new THREE.Group();
 const paint=mat(type.color,.28,.55),dark=mat(0x101820,.35),glass=new THREE.MeshPhysicalMaterial({color:0x163348,roughness:.18,metalness:.25,clearcoat:1});
 box(2.15,.62,4.25,paint,0,.78,0,root);
 box(1.92,.16,1.1,paint,0,1.13,-1.42,root);
 box(1.65,.72,1.85,glass,0,1.43,.05,root);
 box(1.9,.12,.65,paint,0,1.12,1.55,root);
 for(const x of [-1.08,1.08])for(const z of [-1.42,1.42]){
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.32,20),dark);
  tire.rotation.z=Math.PI/2;tire.position.set(x,.43,z);tire.castShadow=true;root.add(tire);root.userData.wheels??=[];root.userData.wheels.push(tire);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.335,16),mat(0xbac4cc,.3,.8));
  hub.rotation.z=Math.PI/2;hub.position.set(x,.43,z);root.add(hub);
 }
 for(const x of [-.7,.7]){
  box(.4,.17,.07,mat(0xfff2c5,.25),x,.83,-2.15,root);
  box(.42,.16,.07,mat(0xb51d1d),x,.83,2.15,root);
 }
 // spoiler
 box(1.8,.1,.35,dark,0,1.2,2.0,root);
 return root;
}
player=createCar(carTypes[selectedCar]);scene.add(player);
player.position.set(0,0,0);
function replacePlayer(){
 const pos=player.position.clone(),rot=player.rotation.y;
 scene.remove(player);player=createCar(carTypes[selectedCar]);player.position.copy(pos);player.rotation.y=rot;scene.add(player);
}

// Traffic cars travel on selected avenue lanes
const traffic=[];
for(let i=0;i<13;i++){
 const t=createCar({color:[0xe8e8e8,0x1b3555,0x8b2424,0x444b52,0xc9a52b][i%5]},true);
 const lane=i%2===0?-4.5:4.5;
 t.position.set(lane,0,-260+i*43);t.rotation.y=i%2===0?0:Math.PI;
 scene.add(t);traffic.push({mesh:t,lane,dir:i%2===0?1:-1,offset:i});
}

// Weather particles
const rainCount=650,rainPositions=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){rainPositions[i*3]=(Math.random()-.5)*90;rainPositions[i*3+1]=Math.random()*35;rainPositions[i*3+2]=(Math.random()-.5)*90;}
const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPositions,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xb9d9ef,size:.12,transparent:true,opacity:.7}));
rain.visible=false;scene.add(rain);
let isNight=false,isRain=false;
function setNight(v){
 isNight=v;
 scene.background=new THREE.Color(v?0x071326:0x8bc8ed);
 scene.fog.color.set(v?0x071326:0x8bc8ed);
 hemi.intensity=v?.38:1.65;sun.intensity=v?.18:2.2;
 groundMat.color.set(v?0x182c27:0x477f3c);
}
function setRain(v){isRain=v;rain.visible=v;scene.fog.near=v?45:110;scene.fog.far=v?190:430;}
let speed=0,yaw=0,nitroFuel=100,boosting=false;
const input={left:false,right:false,gas:false,brake:false,nitro:false};
for(const k of Object.keys(input)){
 const el=document.getElementById(k);
 const down=e=>{e.preventDefault();input[k]=true;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch{}};
 const up=e=>{e.preventDefault();input[k]=false;el.classList.remove('active')};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
}
function toggleCamera(){cameraMode=(cameraMode+1)%2;document.getElementById('cameraBtn').textContent=cameraMode?'📷 CAMERA: COCKPIT':'📷 CAMERA: CHASE';}
document.getElementById('cameraBtn').onclick=toggleCamera;
document.getElementById('timeBtn').onclick=()=>{setNight(!isNight);document.getElementById('timeBtn').textContent=isNight?'☀️ DAY MODE':'🌙 NIGHT MODE';};
document.getElementById('weatherBtn').onclick=()=>{setRain(!isRain);document.getElementById('weatherBtn').textContent=isRain?'🌧️ RAIN: ON':'🌧️ RAIN: OFF';};
document.getElementById('menuBtn').onclick=()=>{document.getElementById('menu').style.display='flex';};
function updateMenu(){
 const c=carTypes[selectedCar];document.getElementById('carName').textContent=c.name;
 document.getElementById('carDesc').textContent=c.desc;document.getElementById('carPreview').textContent=c.emoji;
}
document.getElementById('prevCar').onclick=()=>{selectedCar=(selectedCar+carTypes.length-1)%carTypes.length;updateMenu();};
document.getElementById('nextCar').onclick=()=>{selectedCar=(selectedCar+1)%carTypes.length;updateMenu();};
document.getElementById('menuDay').onclick=()=>{setNight(!isNight);document.getElementById('menuDay').textContent=isNight?'🌙 Night':'☀️ Day';document.getElementById('timeBtn').textContent=isNight?'☀️ DAY MODE':'🌙 NIGHT MODE';};
document.getElementById('menuWeather').onclick=()=>{setRain(!isRain);document.getElementById('menuWeather').textContent=isRain?'🌧️ Rain':'🌤️ Clear';document.getElementById('weatherBtn').textContent=isRain?'🌧️ RAIN: ON':'🌧️ RAIN: OFF';};
document.getElementById('start').onclick=()=>{replacePlayer();document.getElementById('menu').style.display='none';};
updateMenu();

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const c=carTypes[selectedCar];
 boosting=input.nitro&&nitroFuel>0&&speed>1;
 const maxSpeed=c.top*(boosting?1.45:1);
 if(input.gas)speed+= (boosting?23:13)*dt;
 else if(input.brake)speed-=18*dt;
 else speed*=Math.pow(isRain?.988:.993,dt*60);
 speed=THREE.MathUtils.clamp(speed,-10,maxSpeed);
 if(boosting)nitroFuel=Math.max(0,nitroFuel-28*dt);else nitroFuel=Math.min(100,nitroFuel+9*dt);
 const steer=(input.left?1:0)-(input.right?1:0);
 yaw+=steer*(.7+Math.min(Math.abs(speed)/20,1))*Math.sign(speed||1)*dt;
 player.rotation.y=yaw;
 player.position.x-=Math.sin(yaw)*speed*dt;
 player.position.z-=Math.cos(yaw)*speed*dt;
 for(const w of (player.userData.wheels||[]))w.rotation.x+=speed*dt*1.7;
 // Keep car in the broad world area
 player.position.x=THREE.MathUtils.clamp(player.position.x,-650,650);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-650,650);
 // Traffic moves continuously; recycle cars ahead
 for(const t of traffic){
  t.mesh.position.z-=t.dir*dt*13;
  if(t.mesh.position.z<-310)t.mesh.position.z=310;
  if(t.mesh.position.z>310)t.mesh.position.z=-310;
 }
 // Rain falls around the player
 if(isRain){
  const p=rainGeo.attributes.position;
  for(let i=0;i<rainCount;i++){
   p.array[i*3+1]-=28*dt;
   if(p.array[i*3+1]<0){p.array[i*3+1]=30+Math.random()*8;p.array[i*3]=player.position.x+(Math.random()-.5)*90;p.array[i*3+2]=player.position.z+(Math.random()-.5)*90;}
  }
  p.needsUpdate=true;rain.position.set(player.position.x,0,player.position.z);
 }
 // Chase or cockpit camera
 let desired;
 if(cameraMode===0){
  desired=new THREE.Vector3(player.position.x+Math.sin(yaw)*10,5.3,player.position.z+Math.cos(yaw)*10);
  camera.position.lerp(desired,1-Math.pow(.001,dt));
  camera.lookAt(player.position.x,1.1,player.position.z);
 }else{
  desired=new THREE.Vector3(player.position.x-Math.sin(yaw)*.05,1.65,player.position.z-Math.cos(yaw)*.45);
  camera.position.lerp(desired,1-Math.pow(.001,dt));
  camera.rotation.set(0,yaw,0);
 }
 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*5);
 document.getElementById('boostText').textContent=boosting?'⚡ NITRO BOOST':`NITRO ${Math.round(nitroFuel)}%`;
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
